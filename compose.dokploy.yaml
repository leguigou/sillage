# Déploiement Dokploy — https://sillage.deloffre.fr
# Ne pas déclarer de labels Traefik : Dokploy les injecte au déploiement.
# Les variables ${…} sont fournies par l'onglet « Environment » du service.
# MySQL est nommé « sillage-db » : sur le réseau dokploy-network, l'alias « db »
# est déjà pris par une autre base, ce qui rendrait la résolution ambiguë.
services:
  app:
    build:
      context: .
    expose:
      - "80"
    environment:
      - APP_ENV=production
      - APP_URL=${APP_URL:-https://sillage.deloffre.fr}
      - APP_KEY=${APP_KEY}
      - COMPANY_NAME=${COMPANY_NAME:-Cabesto}
      - ALLOWED_DOMAINS=${ALLOWED_DOMAINS:-cabesto.com}
      - EMAIL_DOMAIN_RESTRICTION=${EMAIL_DOMAIN_RESTRICTION:-true}
      - DB_HOST=sillage-db
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE:-sillage}
      - DB_USERNAME=${DB_USERNAME:-sillage}
      - DB_PASSWORD=${DB_PASSWORD}
      - MAIL_TRANSPORT=${MAIL_TRANSPORT:-mail}
      - MAIL_FROM=${MAIL_FROM}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_STARTTLS=${SMTP_STARTTLS:-on}
      - SESSION_SECURE=true
      - UPLOAD_MAX_MB=10
    volumes:
      - sillage_storage:/var/www/html/storage
    depends_on:
      sillage-db:
        condition: service_healthy
    restart: unless-stopped
    # Relais SMTP optionnel, migrations idempotentes, puis Apache au premier plan.
    command:
      - sh
      - /var/www/html/deploy/entrypoint-dokploy.sh
      - app
  sillage-db:
    image: mysql:8.4
    environment:
      - MYSQL_DATABASE=${DB_DATABASE:-sillage}
      - MYSQL_USER=${DB_USERNAME:-sillage}
      - MYSQL_PASSWORD=${DB_PASSWORD}
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
    volumes:
      - sillage_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped
  # File d'attente e-mail des notifications : php bin/console.php notifications:send
  scheduler:
    build:
      context: .
    environment:
      - APP_ENV=production
      - APP_URL=${APP_URL:-https://sillage.deloffre.fr}
      - APP_KEY=${APP_KEY}
      - COMPANY_NAME=${COMPANY_NAME:-Cabesto}
      - ALLOWED_DOMAINS=${ALLOWED_DOMAINS:-cabesto.com}
      - EMAIL_DOMAIN_RESTRICTION=${EMAIL_DOMAIN_RESTRICTION:-true}
      - DB_HOST=sillage-db
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE:-sillage}
      - DB_USERNAME=${DB_USERNAME:-sillage}
      - DB_PASSWORD=${DB_PASSWORD}
      - MAIL_TRANSPORT=${MAIL_TRANSPORT:-mail}
      - MAIL_FROM=${MAIL_FROM}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_STARTTLS=${SMTP_STARTTLS:-on}
      - SESSION_SECURE=true
    volumes:
      - sillage_storage:/var/www/html/storage
    depends_on:
      sillage-db:
        condition: service_healthy
    restart: unless-stopped
    command:
      - sh
      - /var/www/html/deploy/entrypoint-dokploy.sh
      - worker
volumes:
  sillage_mysql:
    name: sillage_mysql
  sillage_storage:
    name: sillage_storage
