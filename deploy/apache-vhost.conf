# Adaptez ServerName et les chemins. Activez TLS avec votre hébergeur ou reverse proxy.
<VirtualHost *:80>
    ServerName sillage.example.com
    DocumentRoot /var/www/sillage/current/public
    <Directory /var/www/sillage/current/public>
        Options -Indexes -MultiViews
        AllowOverride None
        Require all granted
        DirectoryIndex index.php
        RewriteEngine On
        RewriteRule ^ - [E=HTTP_AUTHORIZATION:%{HTTP:Authorization}]
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteRule ^ index.php [QSA,L]
        <FilesMatch "^\.(?!well-known$)">
            Require all denied
        </FilesMatch>
    </Directory>
    ErrorLog ${APACHE_LOG_DIR}/sillage-error.log
    CustomLog ${APACHE_LOG_DIR}/sillage-access.log combined
</VirtualHost>
