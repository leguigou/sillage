name: Vérifier Sillage
on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  php-mysql:
    runs-on: ubuntu-latest
    container: php:8.4-cli
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: sillage_test
          MYSQL_USER: sillage_test
          MYSQL_PASSWORD: ci-isolated-password
          MYSQL_ROOT_PASSWORD: ci-root-password
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    env:
      APP_ENV: local
      APP_KEY: 'a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1'
      APP_URL: http://127.0.0.1:8089
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: sillage_test
      DB_USERNAME: sillage_test
      DB_PASSWORD: ci-isolated-password
      SESSION_SECURE: 'false'
      MAIL_TRANSPORT: log
      MAIL_FROM: sillage@example.com
      COMPANY_NAME: Entreprise de test
      ALLOWED_DOMAINS: example.com
      EMAIL_DOMAIN_RESTRICTION: 'true'
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
      - name: Installer les extensions de test
        run: |
          apt-get update
          apt-get install -y --no-install-recommends libxml2-dev libonig-dev libcurl4-openssl-dev libzip-dev python3 python3-venv
          docker-php-ext-install pdo_mysql mbstring curl dom zip
          python3 -m venv /tmp/sillage-mcp-sdk
          /tmp/sillage-mcp-sdk/bin/pip install -r tests/requirements-mcp.txt
      - name: Vérifier la syntaxe PHP
        run: find app public routes bin tests database -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Vérifier l’historique des versions
        run: php bin/console.php history:check
      - name: Tester les contrats MySQL
        run: php tests/run.php
      - name: Tester les workflows HTTP
        run: |
          php tests/run.php fixtures
          php -S 127.0.0.1:8089 -t "$PWD/public" "$PWD/public/router.php" > /tmp/sillage-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID"' EXIT
          python3 -c 'import time,urllib.request; time.sleep(2); urllib.request.urlopen("http://127.0.0.1:8089/login")'
          python3 tests/http_workflows.py
          # http_workflows.py signs in 10 times from 127.0.0.1, the login limit; reset it before the next suite.
          php tests/run.php fixtures
          python3 tests/http_ticket_people.py
          php tests/run.php fixtures
          SILLAGE_MCP_PYTHON=/tmp/sillage-mcp-sdk/bin/python python3 tests/http_mcp.py
      # Exports the data left by the HTTP workflows, imports it into a second, freshly migrated
      # database and compares both table by table; a second import must be refused.
      - name: Tester le transfert complet d’un site
        env:
          MYSQL_ROOT_PASSWORD: ci-root-password
        run: |
          php bin/console.php site:export /tmp/sillage-export
          php tests/site_transfer_roundtrip.php prepare sillage_import
          DB_DATABASE=sillage_import php bin/console.php migrate
          DB_DATABASE=sillage_import php bin/console.php site:import /tmp/sillage-export/sillage-site-*.zip
          php tests/site_transfer_roundtrip.php compare sillage_test sillage_import
          if DB_DATABASE=sillage_import php bin/console.php site:import /tmp/sillage-export/sillage-site-*.zip; then
            echo 'ÉCHEC : un second import sur un site non vide a été accepté'; exit 1
          fi
      - name: Tester une autre société avec domaines restreints
        env:
          COMPANY_NAME: Atelier Horizon & Associés
          ALLOWED_DOMAINS: atelier-horizon.example,horizon-services.example
          EMAIL_DOMAIN_RESTRICTION: 'true'
        run: |
          php tests/run.php fixtures
          php -S 127.0.0.1:8089 -t "$PWD/public" "$PWD/public/router.php" > /tmp/sillage-company-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID"' EXIT
          python3 -c 'import time,urllib.request; time.sleep(2); urllib.request.urlopen("http://127.0.0.1:8089/login")'
          python3 tests/http_company.py
      - name: Tester une autre société sans restriction de domaine
        env:
          COMPANY_NAME: Atelier Horizon & Associés
          ALLOWED_DOMAINS: ''
          EMAIL_DOMAIN_RESTRICTION: 'false'
        run: |
          php tests/run.php fixtures
          php -S 127.0.0.1:8089 -t "$PWD/public" "$PWD/public/router.php" > /tmp/sillage-company-open-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID"' EXIT
          python3 -c 'import time,urllib.request; time.sleep(2); urllib.request.urlopen("http://127.0.0.1:8089/login")'
          python3 tests/http_company.py --open
      - name: Tester les branches de tickets avec transport Git simulé
        run: |
          php tests/run.php fixtures
          php -S 127.0.0.1:8089 -t "$PWD/public" "$PWD/tests/git_router.php" > /tmp/sillage-git-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID"' EXIT
          python3 -c 'import time,urllib.request; time.sleep(2); urllib.request.urlopen("http://127.0.0.1:8089/login")'
          python3 tests/http_ticket_branches.py
          python3 tests/http_deployment_badges.py
